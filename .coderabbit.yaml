# CodeRabbit Configuration for Dicty
# https://docs.coderabbit.ai/guides/configure-coderabbit

version: 2
language: "en-US"
early_access: false

reviews:
  # Review profile: "chill" is concise, "assertive" is strict engineering focus
  profile: "assertive"
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    # Review PRs targeting main or any release/feature branch
    base_branches:
      - "main"
      - ".*"

  # High-signal focus: ignore lockfiles, autogenerated files, and assets
  path_filters:
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!**/*.png"
    - "!**/*.svg"
    - "!**/*.ico"
    - "!**/*.rgba"
    - "!**/*.wav"

  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true

chat:
  auto_reply: true
