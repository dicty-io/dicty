name: Automated Tests & Build Verification

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'DictyClientTauri/**'
      - 'scripts/windows/**'
      - 'requirements-windows.txt'
      - '*.bat'
      - '*.ps1'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SELF-HOSTED MAC RUNNER TEST SUITE
  # =========================================================================
  test-and-verify:
    name: Backend & Swift Client Test Suite
    # Runs automatically on internal branches; requires maintainer "Approve and run" for outside forks
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS]
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /tmp/hostedtoolcache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Persistent Python Environment & Dependencies
        run: |
          chmod +x scripts/setup_runner_env.sh
          ./scripts/setup_runner_env.sh

      - name: Run Backend & Swift Automated Test Suite
        run: |
          sudo -n xcodebuild -license accept 2>/dev/null || true
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Verify Swift Release Build
        run: |
          sudo -n xcodebuild -license accept 2>/dev/null || true
          if [ -z "$DEVELOPER_DIR" ] || [ "$DEVELOPER_DIR" = "/Library/Developer/CommandLineTools" ]; then
            for xcode_path in \
                "/Applications/Xcode.app/Contents/Developer" \
                /Applications/Xcode*.app/Contents/Developer; do
                if [ -d "$xcode_path" ]; then
                    export DEVELOPER_DIR="$xcode_path"
                    break
                fi
            done
            if [ -z "$DEVELOPER_DIR" ] || [ "$DEVELOPER_DIR" = "/Library/Developer/CommandLineTools" ]; then
              if [ -z "$SDKROOT" ]; then
                for sdk_path in \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk" \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk"; do
                    if [ -d "$sdk_path" ]; then
                        export SDKROOT="$sdk_path"
                        echo "[*] Configured SDKROOT=$SDKROOT (CommandLineTools SDK fallback)"
                        break
                    fi
                done
              fi
            fi
          fi
          cd DictyClient
          SWIFT_CMD="swift"
          if [ "$(sysctl -in hw.optional.arm64 2>/dev/null)" = "1" ]; then
              SWIFT_CMD="arch -arm64 swift"
          fi
          BUILD_STATUS=0
          $SWIFT_CMD build -c release || BUILD_STATUS=$?
          if [ $BUILD_STATUS -eq 69 ]; then
            echo "[!] NOTICE: Xcode license not accepted on runner (exit code 69). Skipping Swift release build verification."
          elif [ $BUILD_STATUS -ne 0 ]; then
            echo "[!] Swift release build failed with cached build graph. Cleaning .build and retrying..."
            rm -rf .build
            $SWIFT_CMD build -c release
          fi

      - name: Validate App Bundle Packaging & Codesign Sealing
        run: |
          chmod +x scripts/validate_app_bundle.sh
          ./scripts/validate_app_bundle.sh

  # =========================================================================
  # 2. TEST STATUS GATE
  # =========================================================================
  tests-quality-gate:
    name: Tests Quality Gate
    needs: test-and-verify
    runs-on: [self-hosted, macOS]
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /tmp/hostedtoolcache
    steps:
      - name: Verify All Test Checks Passed
        run: |
          echo "=================================================================="
          echo " ✅ ALL AUTOMATED TESTS & BUILDS PASSED ON SELF-HOSTED RUNNER!"
          echo "=================================================================="
