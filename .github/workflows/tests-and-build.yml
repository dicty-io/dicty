name: Automated Tests & Build Verification

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'DictyClientTauri/**'
      - 'scripts/windows/**'
      - 'requirements-windows.txt'
      - '*.bat'
      - '*.ps1'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'DictyClientTauri/**'
      - 'scripts/windows/**'
      - 'requirements-windows.txt'
      - '*.bat'
      - '*.ps1'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. GITHUB-HOSTED PYTHON BACKEND TEST SUITE (Safe for outside forks)
  # =========================================================================
  python-tests:
    name: Python Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ['3.12']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Backend Unit Tests with Coverage
        run: |
          chmod +x scripts/check_engine_endpoint.sh
          ./scripts/check_engine_endpoint.sh
          python3 -m coverage run -m unittest discover -s tests -p "test_*.py" -v
          python3 -m coverage xml -o coverage.xml

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # 2. SELF-HOSTED MAC RUNNER TEST SUITE (Apple Silicon Metal & Swift Build)
  # =========================================================================
  test-and-verify:
    name: Backend & Swift Client Test Suite (macOS Apple Silicon)
    # Runs only on pushes to main or manual workflow dispatch (skips on PRs for fast feedback)
    if: github.repository == 'dicty-io/dicty' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Persistent Python Environment & Dependencies
        run: |
          chmod +x scripts/setup_runner_env.sh
          ./scripts/setup_runner_env.sh

      - name: Select Xcode Toolchain
        run: |
          CURRENT_XCODE="$(xcode-select -p 2>/dev/null || true)"
          if [ -z "$CURRENT_XCODE" ] || [ "$CURRENT_XCODE" = "/Library/Developer/CommandLineTools" ] || [ ! -d "$CURRENT_XCODE" ]; then
            for xcode_path in \
                "/Applications/Xcode.app/Contents/Developer" \
                $(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort -V -r); do
                if [ -d "$xcode_path" ]; then
                    echo "[*] Selecting Xcode: $xcode_path"
                    sudo xcode-select -s "$xcode_path" 2>/dev/null || true
                    break
                fi
            done
          fi
          sudo -n xcodebuild -license accept 2>/dev/null || true
          echo "[*] Active Xcode: $(xcode-select -p 2>/dev/null || echo 'none')"
          xcodebuild -version 2>/dev/null || true
          swift --version 2>&1 | head -n 1

      - name: Run Backend Automated Test Suite
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh --backend-only

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Verify Swift Release Build
        run: |
          sudo -n xcodebuild -license accept 2>/dev/null || true
          if [ -z "$DEVELOPER_DIR" ] || [ "$DEVELOPER_DIR" = "/Library/Developer/CommandLineTools" ]; then
            CURRENT_XCODE="$(xcode-select -p 2>/dev/null || true)"
            if [ -n "$CURRENT_XCODE" ] && [ "$CURRENT_XCODE" != "/Library/Developer/CommandLineTools" ] && [ -d "$CURRENT_XCODE" ]; then
              export DEVELOPER_DIR="$CURRENT_XCODE"
            else
              for xcode_path in \
                  "/Applications/Xcode.app/Contents/Developer" \
                  $(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort -V -r); do
                  if [ -d "$xcode_path" ]; then
                      export DEVELOPER_DIR="$xcode_path"
                      break
                  fi
              done
            fi
            if [ -z "$DEVELOPER_DIR" ] || [ "$DEVELOPER_DIR" = "/Library/Developer/CommandLineTools" ]; then
              if [ -z "$SDKROOT" ]; then
                for sdk_path in \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk" \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX15.sdk" \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX14.sdk" \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk" \
                    "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk"; do
                    if [ -d "$sdk_path" ]; then
                        export SDKROOT="$sdk_path"
                        echo "[*] Configured SDKROOT=$SDKROOT (CommandLineTools SDK fallback)"
                        break
                    fi
                done
              fi
            fi
          fi
          cd DictyClient
          SWIFT_CMD="swift"
          if [ "$(sysctl -in hw.optional.arm64 2>/dev/null)" = "1" ]; then
              SWIFT_CMD="arch -arm64 swift"
          fi
          BUILD_STATUS=0
          $SWIFT_CMD build -c release || BUILD_STATUS=$?
          if [ $BUILD_STATUS -eq 69 ]; then
            echo "[!] NOTICE: Xcode license not accepted on runner (exit code 69). Skipping Swift release build verification."
          elif [ $BUILD_STATUS -ne 0 ]; then
            echo "[!] Swift release build failed with cached build graph. Cleaning .build and retrying..."
            rm -rf .build
            $SWIFT_CMD build -c release
          fi

      - name: Validate App Bundle Packaging & Codesign Sealing
        run: |
          chmod +x scripts/validate_app_bundle.sh
          ./scripts/validate_app_bundle.sh

  # =========================================================================
  # 3. TEST STATUS GATE
  # =========================================================================
  tests-quality-gate:
    name: Tests Quality Gate
    if: always()
    needs: [python-tests, test-and-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Test Checks Passed
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "[-] python-tests failed!"
            exit 1
          fi
          if [ "${{ needs.test-and-verify.result }}" != "success" ] && [ "${{ needs.test-and-verify.result }}" != "skipped" ]; then
            echo "[-] test-and-verify failed!"
            exit 1
          fi
          echo "=================================================================="
          echo " ✅ ALL AUTOMATED TESTS & BUILDS PASSED!"
          echo "=================================================================="
