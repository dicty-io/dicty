name: Automated Tests & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full sweep: catches toolchain drift and flaky Swift tests without blocking PRs.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND TEST SUITE
  # Runs on every PR and push. macOS-only: the engine is macOS/Windows only,
  # and the suite imports audio/TTS services that need the macOS toolchain.
  # =========================================================================
  python-tests:
    name: Backend Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run Backend Unit Tests with Coverage
        run: |
          chmod +x scripts/check_engine_endpoint.sh
          ./scripts/check_engine_endpoint.sh
          python3 -m coverage run -m unittest discover -s tests -p "test_*.py" -v
          python3 -m coverage xml -o coverage.xml

      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # 2. SWIFT CLIENT RELEASE BUILD
  # Compile gate for the macOS client. Runs on PRs so that Swift compile
  # errors fail before merge instead of turning main red after merge.
  # =========================================================================
  swift-build:
    name: Swift Client Release Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Swift Package Build
        uses: actions/cache@v4
        with:
          path: DictyClient/.build
          key: swift-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            swift-build-${{ runner.os }}-

      - name: Show Active Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build Client (release)
        working-directory: DictyClient
        run: |
          if ! swift build -c release; then
            echo "[!] Release build failed with the restored build cache."
            echo "[!] Clearing .build and retrying from scratch..."
            rm -rf .build
            swift build -c release
          fi

      - name: Validate App Bundle Packaging & Codesign Sealing
        run: |
          chmod +x scripts/validate_app_bundle.sh
          ./scripts/validate_app_bundle.sh

  # =========================================================================
  # 3. SWIFT TEST SUITE (nightly / manual only)
  # Kept off the PR path: the suite has a history of runner flakiness, and a
  # flaky check would block contributors. A nightly run still surfaces real
  # regressions and gives us evidence before it becomes a PR problem.
  # =========================================================================
  swift-tests:
    name: Swift Test Suite (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Swift Package Build
        uses: actions/cache@v4
        with:
          path: DictyClient/.build
          key: swift-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            swift-test-${{ runner.os }}-

      - name: Show Active Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run Swift Test Suite
        run: |
          make test-swift

  # =========================================================================
  # 4. TEST STATUS GATE
  # Always runs so the required check always reports a result, including when
  # optional jobs are skipped (nightly-only suites, fork PRs).
  # =========================================================================
  tests-quality-gate:
    name: Tests Quality Gate
    if: always()
    needs: [python-tests, swift-build, swift-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify All Test Checks Passed
        env:
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          SWIFT_BUILD: ${{ needs.swift-build.result }}
          SWIFT_TESTS: ${{ needs.swift-tests.result }}
        run: |
          echo "Backend Tests:              $PYTHON_TESTS"
          echo "Swift Client Release Build: $SWIFT_BUILD"
          echo "Swift Test Suite (nightly): $SWIFT_TESTS"
          echo ""

          FAILED=0
          if [ "$PYTHON_TESTS" != "success" ]; then
            echo "[-] Backend tests did not pass."
            FAILED=1
          fi
          if [ "$SWIFT_BUILD" != "success" ]; then
            echo "[-] Swift client release build did not pass."
            FAILED=1
          fi
          case "$SWIFT_TESTS" in
            success|skipped) ;;
            *)
              echo "[-] Nightly Swift test suite did not pass."
              FAILED=1
              ;;
          esac

          if [ "$FAILED" -ne 0 ]; then
            echo "=================================================================="
            echo " ❌ REQUIRED CHECKS FAILED"
            echo "=================================================================="
            exit 1
          fi

          echo "=================================================================="
          echo " ✅ ALL AUTOMATED TESTS & BUILDS PASSED!"
          echo "=================================================================="
