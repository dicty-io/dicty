name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      custom_version:
        description: 'Custom version (required only if bump_type is "custom", e.g. 1.2.0)'
        required: false
        type: string
        default: ''
      release_notes_hint:
        description: 'Optional focus/highlights for release description (e.g. "Meeting mode mute control and stability fixes")'
        required: false
        type: string
        default: ''
      build_mac:
        description: 'macOS DMG: auto = build only when macOS or shared files changed'
        required: true
        type: choice
        options:
          - auto
          - always
          - never
        default: auto
      build_windows:
        description: 'Windows installer: auto = build only when Windows or shared files changed'
        required: true
        type: choice
        options:
          - auto
          - always
          - never
        default: auto

permissions:
  contents: write         # create releases/tags
  pull-requests: read     # read commit & PR metadata

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next_tag: ${{ steps.compute.outputs.next_tag }}
      build_mac: ${{ steps.changes.outputs.build_mac }}
      build_windows: ${{ steps.changes.outputs.build_windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate AI Release Notes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'qwen/qwen3.7-plus' }}
          RELEASE_HIGHLIGHTS: ${{ github.event.inputs.release_notes_hint }}
        run: |
          python3 .github/scripts/generate_release_notes.py

      - name: Detect changed platforms
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_MODE: ${{ inputs.build_mac }}
          WINDOWS_MODE: ${{ inputs.build_windows }}
        run: |
          set -euo pipefail

          # Compare against the last *published* release, so re-running this
          # workflow reuses the same diff instead of comparing a tag to itself.
          PREV_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [ -z "$PREV_TAG" ]; then
            echo "[!] No previous release tag found; treating every platform as changed."
            CHANGED=""
          else
            echo "[*] Files changed since ${PREV_TAG}:"
            CHANGED="$(git diff --name-only "${PREV_TAG}..HEAD")"
            echo "$CHANGED" | sed 's/^/    /'
          fi

          # Paths that ship in both the macOS and the Windows build.
          SHARED='^(\.github/workflows/release\.yml|main\.py|dicty_engine\.py|dicty_engine\.spec|services/|routers/|integrations/|compat_libs/|assets/|requirements\.txt|requirements-desktop\.txt|models_config\.json|custom_prompts\.json|vocabulary\.json)'
          MAC_ONLY='^(DictyClient/|make_dmg\.sh|build_mac\.sh|Casks/|scripts/setup_runner_env\.sh|scripts/compile_whisper\.sh|scripts/validate_app_bundle\.sh)'
          WIN_ONLY='^(DictyClientTauri/|scripts/windows/|requirements-windows\.txt)'

          mac_changed=true
          windows_changed=true
          if [ -n "$CHANGED" ]; then
            mac_changed=false
            windows_changed=false
            # Here-strings, not `echo | grep -q`: under `pipefail`, grep exiting
            # on the first match can SIGPIPE the writer and make the whole
            # pipeline fail, silently skipping a platform.
            if grep -qE "$SHARED" <<< "$CHANGED"; then
              mac_changed=true
              windows_changed=true
            fi
            if grep -qE "$MAC_ONLY" <<< "$CHANGED"; then
              mac_changed=true
            fi
            if grep -qE "$WIN_ONLY" <<< "$CHANGED"; then
              windows_changed=true
            fi
          fi

          resolve() {
            case "$1" in
              always) echo true ;;
              never)  echo false ;;
              *)      echo "$2" ;;
            esac
          }

          BUILD_MAC="$(resolve "${MAC_MODE:-auto}" "$mac_changed")"
          BUILD_WINDOWS="$(resolve "${WINDOWS_MODE:-auto}" "$windows_changed")"

          echo "[*] macOS:   changed=${mac_changed} mode=${MAC_MODE:-auto} -> build=${BUILD_MAC}"
          echo "[*] Windows: changed=${windows_changed} mode=${WINDOWS_MODE:-auto} -> build=${BUILD_WINDOWS}"

          if [ "$BUILD_MAC" != "true" ] && [ "$BUILD_WINDOWS" != "true" ]; then
            echo "[-] No platform has relevant changes since ${PREV_TAG:-the beginning of history}."
            echo "[-] Nothing to release. Set build_mac/build_windows to 'always' to override."
            exit 1
          fi

          echo "build_mac=${BUILD_MAC}" >> "$GITHUB_OUTPUT"
          echo "build_windows=${BUILD_WINDOWS}" >> "$GITHUB_OUTPUT"

      - name: Compute next version & create draft release
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BUILD_MAC: ${{ steps.changes.outputs.build_mac }}
          BUILD_WINDOWS: ${{ steps.changes.outputs.build_windows }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const bumpType = (context.payload.inputs?.bump_type || 'patch').trim().toLowerCase();
            const customVersionInput = (context.payload.inputs?.custom_version || '').trim();

            core.info(`Manual release triggered by @${context.actor}: bump_type=${bumpType}, custom_version=${customVersionInput}`);
            core.info(`Platforms to build: macOS=${process.env.BUILD_MAC} windows=${process.env.BUILD_WINDOWS}`);

            // Get latest release tag
            let latestTag;
            try {
              const latest = await github.rest.repos.getLatestRelease({ owner, repo });
              latestTag = latest.data.tag_name;
            } catch {
              // Baseline if repository has no releases yet
              latestTag = process.env.BASELINE_TAG || '1.0.71';
            }

            // Normalize
            if (latestTag.startsWith('v')) latestTag = latestTag.slice(1);

            const m = latestTag.match(/^(\d+)\.(\d+)\.(\d+)(?:-(\d+))?$/);
            if (!m) {
              core.setFailed(`Latest tag "${latestTag}" not in standard semver format (X.Y.Z)`);
              return;
            }
            let major = parseInt(m[1], 10);
            let minor = parseInt(m[2], 10);
            let patch = parseInt(m[3], 10);

            let nextTag;
            if (bumpType === 'custom') {
              let cleaned = customVersionInput.replace(/^v/, '').trim();
              if (!/^\d+\.\d+\.\d+$/.test(cleaned)) {
                core.setFailed(`Invalid custom version "${customVersionInput}". Expected format: X.Y.Z (e.g. 1.2.0)`);
                return;
              }
              nextTag = cleaned;
            } else if (bumpType === 'major') {
              major += 1;
              minor = 0;
              patch = 0;
              nextTag = `${major}.${minor}.${patch}`;
            } else if (bumpType === 'minor') {
              minor += 1;
              patch = 0;
              nextTag = `${major}.${minor}.${patch}`;
            } else {
              // Default: patch
              patch += 1;
              nextTag = `${major}.${minor}.${patch}`;
            }

            let notes = '';
            try {
              notes = require('fs').readFileSync('RELEASE_NOTES.md', 'utf8');
            } catch(e) {
              notes = `### Release v${nextTag}\n\nManual release triggered by @${context.actor}.`;
            }

            const tagName = `v${nextTag}`;
            core.info(`Calculated release version: ${latestTag} -> ${nextTag}`);

            // The release is created as a DRAFT. It is only published by the
            // `publish` job once every requested installer has been uploaded,
            // so a failed build never leaves a public release without assets.
            try {
              const created = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tagName,
                name: tagName,
                body: notes,
                draft: true,
                prerelease: false,
                target_commitish: context.sha
              });
              core.info(`Created draft release ${tagName} (id ${created.data.id}).`);
            } catch (err) {
              if (err.status !== 422) throw err;

              // Re-run on the same version: reuse the existing draft.
              // `getReleaseByTag` does not return drafts, so look through the
              // release list instead.
              const all = await github.paginate(github.rest.repos.listReleases, {
                owner, repo, per_page: 100
              });
              const existing = all.find(r => r.tag_name === tagName);
              if (!existing) throw err;
              if (!existing.draft) {
                core.setFailed(`Release ${tagName} is already published. Use a new version instead of re-running this one.`);
                return;
              }
              // The create call pinned the draft to context.sha. A draft found
              // here was created by an earlier run; if its target differs, the
              // installers about to be uploaded would belong to a different
              // commit than the tag. Refuse instead of silently retargeting.
              if (existing.target_commitish && existing.target_commitish !== context.sha) {
                core.setFailed(`Draft ${tagName} targets ${existing.target_commitish}, but this run is on ${context.sha}. Delete the draft or re-run on the original commit.`);
                return;
              }
              core.warning(`Draft ${tagName} already exists; updating its notes.`);
              await github.rest.repos.updateRelease({
                owner, repo,
                release_id: existing.id,
                name: tagName,
                body: notes,
                target_commitish: context.sha
              });
            }

            core.setOutput('next_tag', nextTag);

      - name: Summary
        run: |
          echo "Draft release v${{ steps.compute.outputs.next_tag }} created."
          echo "macOS build:   ${{ steps.changes.outputs.build_mac }}"
          echo "Windows build: ${{ steps.changes.outputs.build_windows }}"
          echo "The release is published automatically once the requested installers are uploaded."

  build_mac:
    needs: release
    if: needs.release.outputs.build_mac == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    env:
      DEVELOPER_ID_CERTIFICATE_CONFIGURED: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Apple Developer ID Certificate (if configured)
        if: env.DEVELOPER_ID_CERTIFICATE_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'dicty-build-temp' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/"//g')
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Persistent Python Environment & Dependencies
        run: |
          chmod +x scripts/setup_runner_env.sh
          ./scripts/setup_runner_env.sh

      - name: Show Active Toolchain
        run: |
          # GitHub-hosted macOS images ship with DEVELOPER_DIR already selected.
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Cache whisper.cpp Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/whisper.cpp/build
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/compile_whisper.sh') }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Cache Swift Package Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DictyClient/.build
          key: release-swift-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            release-swift-${{ runner.os }}-

      - name: Verify Signing Configuration
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          echo "[*] Certificate imported: ${DEVELOPER_ID_CERTIFICATE_CONFIGURED}"
          if [ "${DEVELOPER_ID_CERTIFICATE_CONFIGURED}" = "true" ] && [ -z "${DEVELOPER_ID_APPLICATION:-}" ]; then
            echo "[-] A Developer ID certificate is configured, but DEVELOPER_ID_APPLICATION is empty."
            echo "[-] Refusing to publish an ad-hoc signed build. Set DEVELOPER_ID_APPLICATION or remove the certificate secret."
            exit 1
          fi
          if [ "${DEVELOPER_ID_CERTIFICATE_CONFIGURED}" = "true" ]; then
            echo "[*] Identities available for code signing:"
            security find-identity -v -p codesigning "${KEYCHAIN_PATH:-}" | sed 's/^/    /'
            if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH:-}" | grep -qF "${DEVELOPER_ID_APPLICATION}"; then
              echo "[-] '${DEVELOPER_ID_APPLICATION}' is not present in the build keychain."
              exit 1
            fi
          fi

      - name: Build DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          DICTY_VERSION: ${{ needs.release.outputs.next_tag }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          # Developer ID signing + notarization (leave unset to build a locally-signed DMG)
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./make_dmg.sh

      - name: Verify Signing & Notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [ ! -f dist/Dicty.dmg ]; then
            echo "[-] make_dmg.sh completed but dist/Dicty.dmg does not exist."
            exit 1
          fi
          echo "[*] DMG size: $(du -h dist/Dicty.dmg | cut -f1)"

          if [ -z "${DEVELOPER_ID_APPLICATION:-}" ]; then
            echo "[!] No Developer ID configured: DMG is ad-hoc signed and will not pass Gatekeeper on other machines."
            exit 0
          fi

          echo "[*] Verifying DMG signature..."
          codesign --verify --verbose=2 dist/Dicty.dmg

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            echo "[*] Verifying notarization ticket is stapled to the DMG..."
            xcrun stapler validate dist/Dicty.dmg
            echo "[*] Assessing Gatekeeper acceptance..."
            spctl --assess --type open --context context:primary-signature -v dist/Dicty.dmg
          else
            echo "[!] Notarization credentials are not configured: the DMG is signed but not notarized."
          fi

      - name: Remove Build Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "[*] Removed build keychain."
          fi

      - name: Compute Checksum and Upload DMG Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shasum -a 256 dist/Dicty.dmg > dist/Dicty.dmg.sha256
          echo "[+] Generated dist/Dicty.dmg.sha256:"
          cat dist/Dicty.dmg.sha256

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "[*] Uploading dist/Dicty.dmg and checksum to GitHub Release (attempt $i/$MAX_RETRIES)..."
            if gh release upload "v${{ needs.release.outputs.next_tag }}" dist/Dicty.dmg dist/Dicty.dmg.sha256 --clobber; then
              echo "[+] Successfully uploaded Dicty.dmg and Dicty.dmg.sha256 to GitHub Release!"
              break
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "[-] Failed to upload release assets after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "[!] Upload failed. Waiting 10s before retry..."
            sleep 10
          done

  build_windows:
    needs: release
    if: needs.release.outputs.build_windows == 'true'
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'DictyClientTauri/package-lock.json'

      - name: Verify Rust Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Python Virtual Environment
        run: |
          if (-not (Test-Path ".venv")) {
            python -m venv .venv
          }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements-windows.txt

      - name: Package Windows Backend (PyInstaller)
        run: |
          call scripts\windows\build_win.bat
        shell: cmd

      - name: Install Frontend Dependencies
        run: |
          cd DictyClientTauri
          npm ci

      - name: Configure Release Version in Tauri and Frontend
        env:
          VERSION: ${{ needs.release.outputs.next_tag }}
        run: |
          python scripts/update_version.py

      - name: Build Windows Tauri Installer (NSIS .exe)
        shell: powershell
        run: |
          if (-not (Test-Path "DictyClientTauri\src-tauri\resources\dicty_engine\dicty_engine.exe")) {
            Write-Error "[-] Missing DictyClientTauri\src-tauri\resources\dicty_engine\dicty_engine.exe before packaging."
            exit 1
          }
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "DictyClientTauri\src-tauri\target" }
          Remove-Item -Path "$targetDir\release\bundle" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "DictyClientTauri\src-tauri\target\release\bundle" -Recurse -Force -ErrorAction SilentlyContinue
          cd DictyClientTauri
          npm run tauri build

      - name: Compute Checksum and Upload Windows Installer Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ needs.release.outputs.next_tag }}"
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "DictyClientTauri\src-tauri\target" }
          $files = Get-ChildItem -Path "$targetDir\release\bundle\nsis\*.exe", "DictyClientTauri\src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*${{ needs.release.outputs.next_tag }}*" }
          if (-not $files) {
            $files = Get-ChildItem -Path "$targetDir\release\bundle\nsis\*.exe", "DictyClientTauri\src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          }
          if (-not $files) {
            Write-Host "[-] No NSIS installer was produced; the release will stay unpublished."
            exit 1
          }
          foreach ($f in $files) {
            $sha256 = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            $shaFile = "$($f.FullName).sha256"
            "$sha256  $($f.Name)" | Out-File -FilePath $shaFile -Encoding ascii
            Write-Host "Generated SHA256 for $($f.Name): $sha256"
            Write-Host "Uploading $($f.Name) and $($f.Name).sha256 to $tag on GitHub Release..."
            gh release upload $tag $f.FullName $shaFile --clobber
          }

  # =========================================================================
  # 5. PUBLISH
  # Runs after every requested installer has been built and uploaded. The
  # release stays an invisible draft when anything fails, so a partial run
  # never becomes a public release with missing assets.
  # =========================================================================
  publish:
    name: Publish Release
    needs: [release, build_mac, build_windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      # `gh release ...` needs an explicit repository outside a checkout.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (for the Cask definition)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Requested Builds Succeeded
        env:
          TAG: v${{ needs.release.outputs.next_tag }}
          BUILD_MAC: ${{ needs.release.outputs.build_mac }}
          BUILD_WINDOWS: ${{ needs.release.outputs.build_windows }}
          MAC_RESULT: ${{ needs.build_mac.result }}
          WINDOWS_RESULT: ${{ needs.build_windows.result }}
        run: |
          if [ -z "$TAG" ] || [ "$TAG" = "v" ]; then
            echo "[-] The release job did not produce a version tag. Leaving nothing published."
            exit 1
          fi

          echo "macOS:   requested=${BUILD_MAC} result=${MAC_RESULT}"
          echo "Windows: requested=${BUILD_WINDOWS} result=${WINDOWS_RESULT}"

          FAILED=0
          if [ "$BUILD_MAC" = "true" ] && [ "$MAC_RESULT" != "success" ]; then
            echo "[-] macOS build did not succeed. The release stays a draft."
            FAILED=1
          fi
          if [ "$BUILD_WINDOWS" = "true" ] && [ "$WINDOWS_RESULT" != "success" ]; then
            echo "[-] Windows build did not succeed. The release stays a draft."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "[-] Fix the build failure and re-run the workflow; the draft is reused."
            exit 1
          fi

      - name: Verify Expected Assets Were Uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.next_tag }}
          BUILD_MAC: ${{ needs.release.outputs.build_mac }}
          BUILD_WINDOWS: ${{ needs.release.outputs.build_windows }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Assets uploaded to ${TAG}:"
          echo "$ASSETS" | sed 's/^/    /'

          FAILED=0
          if [ "$BUILD_MAC" = "true" ] && ! echo "$ASSETS" | grep -qx "Dicty.dmg"; then
            echo "[-] Dicty.dmg is missing from ${TAG}."
            FAILED=1
          fi
          if [ "$BUILD_WINDOWS" = "true" ] && ! echo "$ASSETS" | grep -qE "\.exe$"; then
            echo "[-] No Windows .exe installer is attached to ${TAG}."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.next_tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          echo "[+] Published ${TAG}."
          gh release view "$TAG" --json url --jq .url

      - name: Bump Homebrew Cask in dicty-io/homebrew-dicty
        # Only a macOS release produces a DMG for the cask to point at.
        if: needs.release.outputs.build_mac == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ needs.release.outputs.next_tag }}
          TAG: v${{ needs.release.outputs.next_tag }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "[!] PUBLIC_REPO_TOKEN is empty or not configured. Skipping Homebrew Cask bump."
            exit 0
          fi

          ASSET_DIR="$(mktemp -d)"
          gh release download "$TAG" --pattern "Dicty.dmg.sha256" --dir "$ASSET_DIR" --clobber
          export SHA256=$(awk '{print $1}' "$ASSET_DIR/Dicty.dmg.sha256")
          echo "Bumping Homebrew Cask to version ${VERSION} with SHA256: ${SHA256}"

          # Clone tap repository with retry mechanism
          rm -rf tap_repo
          CLONE_SUCCESS=false
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "[*] Cloning dicty-io/homebrew-dicty (attempt $i/$MAX_RETRIES)..."
            if git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/dicty-io/homebrew-dicty.git" tap_repo; then
              CLONE_SUCCESS=true
              echo "[+] Successfully cloned homebrew-dicty!"
              break
            fi
            echo "[!] Clone failed. Waiting 10s before retry..."
            sleep 10
          done

          if [ "$CLONE_SUCCESS" != "true" ]; then
            echo "[-] Failed to clone homebrew-dicty after $MAX_RETRIES attempts."
            exit 1
          fi

          mkdir -p tap_repo/Casks

          # Copy and update Cask definition
          cp Casks/dicty.rb tap_repo/Casks/dicty.rb
          python3 -c "
          import os, re
          v = os.environ['VERSION']
          s = os.environ['SHA256']
          with open('tap_repo/Casks/dicty.rb', 'r') as f:
              content = f.read()
          content = re.sub(r'version \".*\"', f'version \"{v}\"', content)
          content = re.sub(r'sha256 \".*\"', f'sha256 \"{s}\"', content)
          with open('tap_repo/Casks/dicty.rb', 'w') as f:
              f.write(content)
          "

          cd tap_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dicty.rb
          if git diff --staged --quiet; then
            echo "Cask is already up to date."
          else
            git commit -m "Bump dicty cask to v${VERSION}"
            PUSH_SUCCESS=false
            for i in $(seq 1 $MAX_RETRIES); do
              echo "[*] Pushing updated cask (attempt $i/$MAX_RETRIES)..."
              if git push origin HEAD; then
                PUSH_SUCCESS=true
                echo "[+] Successfully pushed updated cask to dicty-io/homebrew-dicty!"
                break
              fi
              echo "[!] Push failed. Waiting 10s before retry..."
              sleep 10
            done
            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "[-] Failed to push updated cask after $MAX_RETRIES attempts."
              exit 1
            fi
          fi
          cd ..
          rm -rf tap_repo

